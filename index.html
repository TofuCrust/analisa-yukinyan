<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yukinyan Exit Analysis Dashboard</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&family=DM+Sans:wght@300;400;500;600;700&display=swap');

    :root {
      --bg0: #06090f;
      --bg1: #0d1117;
      --bg2: #151b27;
      --bg3: #1c2436;
      --brd: #1e293b;
      --brd2: #2a3a54;
      --t1: #e2e8f0;
      --t2: #94a3b8;
      --t3: #64748b;
      --grn: #22c55e;
      --grn-d: rgba(34, 197, 94, .12);
      --grn-b: rgba(34, 197, 94, .3);
      --red: #ef4444;
      --red-d: rgba(239, 68, 68, .12);
      --red-b: rgba(239, 68, 68, .3);
      --amb: #f59e0b;
      --amb-d: rgba(245, 158, 11, .1);
      --amb-b: rgba(245, 158, 11, .3);
      --blu: #3b82f6;
      --blu-d: rgba(59, 130, 246, .12);
      --blu-b: rgba(59, 130, 246, .3);
      --cyn: #06b6d4;
      --pur: #a855f7;
      --pnk: #ec4899;
      --teal: #14b8a6;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    body {
      font-family: 'DM Sans', system-ui, sans-serif;
      background: var(--bg0);
      color: var(--t1);
      font-size: 13px
    }

    .mono {
      font-family: 'JetBrains Mono', monospace
    }

    .hdr {
      background: var(--bg1);
      border-bottom: 1px solid var(--brd);
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(12px)
    }

    .hdr-l {
      display: flex;
      align-items: center;
      gap: 10px
    }

    .logo {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, var(--amb), #d97706);
      border-radius: 7px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      font-weight: 700;
      color: #000
    }

    .hdr h1 {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: -.02em
    }

    .hdr .sub {
      font-size: 9.5px;
      color: var(--t3);
      margin-top: 1px
    }

    .tabs {
      display: flex;
      gap: 2px;
      background: var(--bg2);
      border-radius: 7px;
      padding: 2px;
      border: 1px solid var(--brd);
      flex-wrap: wrap
    }

    .tab {
      padding: 5px 11px;
      font-size: 10.5px;
      font-weight: 500;
      border: none;
      background: transparent;
      color: var(--t3);
      cursor: pointer;
      border-radius: 5px;
      transition: .12s;
      white-space: nowrap
    }

    .tab:hover {
      color: var(--t2);
      background: var(--bg3)
    }

    .tab.on {
      font-weight: 600
    }

    .main {
      padding: 12px 20px 40px;
      max-width: 1440px;
      margin: 0 auto
    }

    .g4 {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 7px;
      margin-bottom: 9px
    }

    .g3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 7px;
      margin-bottom: 9px
    }

    .g2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 9px;
      margin-bottom: 9px
    }

    .g6 {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 6px;
      margin-bottom: 9px
    }

    .m {
      background: var(--bg2);
      border: 1px solid var(--brd);
      border-radius: 7px;
      padding: 9px 11px;
      transition: border-color .12s
    }

    .m:hover {
      border-color: var(--brd2)
    }

    .m.hi-a {
      border-color: var(--amb-b);
      background: var(--amb-d)
    }

    .m.hi-g {
      border-color: var(--grn-b);
      background: var(--grn-d)
    }

    .m.hi-r {
      border-color: var(--red-b);
      background: var(--red-d)
    }

    .m.hi-b {
      border-color: var(--blu-b);
      background: var(--blu-d)
    }

    .m .lb {
      font-size: 8.5px;
      color: var(--t3);
      text-transform: uppercase;
      letter-spacing: .06em;
      font-weight: 500;
      margin-bottom: 2px
    }

    .m .vl {
      font-size: 17px;
      font-weight: 600;
      line-height: 1.2
    }

    .m .sb {
      font-size: 9px;
      color: var(--t3);
      margin-top: 2px
    }

    .pos {
      color: var(--grn)
    }

    .neg {
      color: var(--red)
    }

    .wrn {
      color: var(--amb)
    }

    .bl {
      color: var(--blu)
    }

    .cd {
      background: var(--bg2);
      border: 1px solid var(--brd);
      border-radius: 7px;
      padding: 11px 13px;
      margin-bottom: 9px
    }

    .ct {
      font-size: 9.5px;
      font-weight: 600;
      color: var(--t3);
      text-transform: uppercase;
      letter-spacing: .06em;
      margin-bottom: 7px;
      display: flex;
      align-items: center;
      gap: 5px
    }

    .ct .dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      display: inline-block
    }

    .cw {
      position: relative;
      height: 180px
    }

    .cw.tall {
      height: 230px
    }

    .st {
      font-size: 12px;
      font-weight: 600;
      margin: 16px 0 8px;
      padding-left: 8px;
      border-left: 3px solid var(--amb)
    }

    .st.er {
      border-color: var(--red)
    }

    .st.ts {
      border-color: var(--blu)
    }

    .st.hs {
      border-color: var(--pur)
    }

    .st.be {
      border-color: var(--teal)
    }

    .st.dg {
      border-color: var(--cyn)
    }

    .vb {
      background: var(--bg1);
      border-left: 3px solid var(--amb);
      border-radius: 0 6px 6px 0;
      padding: 8px 11px;
      font-size: 10.5px;
      line-height: 1.7;
      color: var(--t2);
      margin-bottom: 9px
    }

    .alert {
      background: var(--amb-d);
      border: 1px solid var(--amb-b);
      border-radius: 7px;
      padding: 9px 12px;
      margin-bottom: 10px;
      display: flex;
      align-items: flex-start;
      gap: 7px;
      font-size: 11px;
      line-height: 1.6
    }

    table.tbl {
      width: 100%;
      font-size: 10.5px;
      border-collapse: collapse
    }

    .tbl th {
      padding: 4px 6px;
      text-align: left;
      color: var(--t3);
      font-weight: 400;
      font-size: 8.5px;
      text-transform: uppercase;
      letter-spacing: .04em;
      border-bottom: 1px solid var(--brd)
    }

    .tbl td {
      padding: 3.5px 6px;
      border-bottom: 1px solid rgba(30, 41, 59, .35)
    }

    .tbl tr:last-child td {
      border-bottom: none
    }

    .tbl .r {
      text-align: right
    }

    .bar-h {
      display: flex;
      height: 16px;
      border-radius: 3px;
      overflow: hidden;
      margin: 3px 0
    }

    .bar-h>div {
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 8px;
      font-weight: 600;
      color: #000;
      min-width: 14px
    }

    .tag {
      display: inline-block;
      padding: 1px 6px;
      border-radius: 3px;
      font-size: 9px;
      font-weight: 500
    }

    .tag-g {
      background: var(--grn-d);
      color: var(--grn);
      border: 1px solid var(--grn-b)
    }

    .tag-r {
      background: var(--red-d);
      color: var(--red);
      border: 1px solid var(--red-b)
    }

    .tag-a {
      background: var(--amb-d);
      color: var(--amb);
      border: 1px solid var(--amb-b)
    }

    .tag-b {
      background: var(--blu-d);
      color: var(--blu);
      border: 1px solid var(--blu-b)
    }

    .no-data {
      text-align: center;
      padding: 30px;
      color: var(--t3);
      font-size: 12px
    }

    .et-tabs {
      display: flex;
      gap: 2px;
      margin-bottom: 10px;
      background: var(--bg1);
      border-radius: 5px;
      padding: 2px;
      border: 1px solid var(--brd);
      width: fit-content
    }

    .et {
      padding: 4px 10px;
      font-size: 10px;
      font-weight: 500;
      border: none;
      background: transparent;
      color: var(--t3);
      cursor: pointer;
      border-radius: 3px;
      transition: .12s
    }

    .et:hover {
      color: var(--t2)
    }

    .et.on {
      font-weight: 600;
      color: #000
    }

    .badge {
      display: inline-block;
      padding: 0 5px;
      border-radius: 3px;
      font-size: 8px;
      font-weight: 600;
      margin-left: 4px
    }

    .badge-best {
      background: var(--grn-d);
      color: var(--grn);
      border: 1px solid var(--grn-b)
    }

    .badge-worst {
      background: var(--red-d);
      color: var(--red);
      border: 1px solid var(--red-b)
    }

    .badge-new {
      background: rgba(6, 182, 212, .15);
      color: var(--cyn);
      border: 1px solid rgba(6, 182, 212, .3)
    }

    .delta {
      font-size: 9px;
      margin-left: 3px
    }

    .delta.up {
      color: var(--grn)
    }

    .delta.dn {
      color: var(--red)
    }

    @media(max-width:1000px) {

      .g4,
      .g6 {
        grid-template-columns: repeat(2, 1fr)
      }

      .g2 {
        grid-template-columns: 1fr
      }

      .hdr {
        flex-direction: column;
        gap: 8px;
        align-items: flex-start
      }

      .tabs {
        flex-wrap: wrap
      }
    }
  </style>
</head>

        erText += ` Worst: ${worstER.label} ($${fmt(worstER.pnl)}, ${worstER.count} trades).`;
        if (erData.length >= 3) {
          const last3 = erData.slice(-3);
          const improving = last3[last3.length - 1].pnl > last3[0].pnl;
          erText += improving ? ' Tren terbaru: <b class="pos">membaik</b>.' : ' Tren terbaru: <b class="neg">masih bleeding</b>.';
        }
        ins.push(erText);
      }
      // 3. Trailing Stop trend
      const tsData = keys.filter(k => S[k].ts).map(k => ({ k, label: S[k].label, pnl: S[k].ts.total_pnl, wr: S[k].ts.win_rate }));
      if (tsData.length >= 2) {
        const first = tsData[0], last = tsData[tsData.length - 1];
        const improving = last.pnl > first.pnl;
        const profitCount = tsData.filter(d => d.pnl > 0).length;
        ins.push(`<b>Trailing Stop</b> ${improving ? 'membaik' : 'memburuk'} dari ${first.label} ($${fmt(first.pnl)}) ke ${last.label} ($${fmt(last.pnl)}). ${profitCount}/${tsData.length} logs profitable.`);
      }
      // 4. Binance Early Exit
      const beData = keys.filter(k => S[k].be).map(k => ({ k, label: S[k].label, pnl: S[k].be.total_pnl, count: S[k].be.count, wr: S[k].be.win_rate }));
      if (beData.length) {
        const totalBE = beData.reduce((s, d) => s + d.pnl, 0);
        const totalBEcount = beData.reduce((s, d) => s + d.count, 0);
        const logNames = beData.map(d => d.label).join(', ');
        ins.push(`<b>${ENAME.be}</b> muncul di ${beData.length} log (${logNames}): total ${totalBEcount} trades, PnL <b class="${totalBE >= 0 ? 'pos' : 'neg'}">$${fmt(totalBE)}</b>, WR ${beData.length === 1 ? fpct(beData[0].wr) : 'varies'}. Exit mechanism baru berbasis Binance price signal.`);
      }
      // 5. Overall profit vs drag
      const allCats = ['fe', 'er', 'ts', 'hs', 'sd', 'be'];
      const catTotals = allCats.map(c => {
        const t = keys.reduce((s, k) => s + (S[k].bd?.[c]?.total_pnl || 0), 0);
        return { cat: c, name: ENAME[c] || c, total: t };
      }).filter(c => Math.abs(c.total) > 0.01).sort((a, b) => b.total - a.total);
      if (catTotals.length) {
        const profitCats = catTotals.filter(c => c.total > 0);
        const dragCats = catTotals.filter(c => c.total < 0);
        let txt = '<b>Overall:</b> ';
        if (profitCats.length) txt += `Profit sources: ${profitCats.map(c => `${c.name} (+$${fmt(c.total)})`).join(', ')}. `;
        if (dragCats.length) txt += `Drag sources: ${dragCats.map(c => `${c.name} ($${fmt(c.total)})`).join(', ')}.`;
        const net = catTotals.reduce((s, c) => s + c.total, 0);
        txt += ` Net all exits: <b class="${net >= 0 ? 'pos' : 'neg'}">$${fmt(net)}</b>.`;
        ins.push(txt);
      }
      return ins;
    }

    function genDiagInsights(dkeys) {
      const ins = [];
      if (!dkeys.length) return ins;
      // Highest warning rate
      const warnRates = dkeys.map(k => ({ k, label: S[k]?.label || k, rate: DG[k].warnings / DG[k].total_events * 100, wpt: S[k] ? DG[k].warnings / S[k].total : 0 }));
      const highWarn = warnRates.reduce((a, b) => a.rate > b.rate ? a : b);
      ins.push(`Highest warning rate: <b>${highWarn.label}</b> (${fmt(highWarn.rate, 1)}% of events, ${fmt(highWarn.wpt, 2)} warns/trade).`);
      // Highest disconnect load
      const dcRates = dkeys.map(k => ({ k, label: S[k]?.label || k, dc: DG[k].disconnects, dpt: S[k] ? DG[k].disconnects / S[k].total : 0 }));
      const highDC = dcRates.reduce((a, b) => a.dc > b.dc ? a : b);
      ins.push(`Highest disconnect volume: <b>${highDC.label}</b> (${highDC.dc} disconnects, ${fmt(highDC.dpt, 1)} per trade).`);
      // Reconnect vs trade volume
      const rcVsTrade = dkeys.filter(k => S[k] && DG[k].reconnects > S[k].total * 5);
      if (rcVsTrade.length) {
        ins.push(`⚠️ Reconnect volume exceeds 5× trade volume in: ${rcVsTrade.map(k => `<b>${S[k]?.label || k}</b> (${DG[k].reconnects} rc vs ${S[k].total} trades)`).join(', ')}.`);
      }
      // Component dominance (event load, not warning-specific)
      const aggComps = {};
      const topCompHits = {};
      const domLogs = [];
      dkeys.forEach(k => {
        const comps = DG[k].components || {};
        Object.entries(comps).forEach(([c, v]) => { aggComps[c] = (aggComps[c] || 0) + v });
        const total = Object.values(comps).reduce((s, v) => s + v, 0);
        const ranked = Object.entries(comps).sort((a, b) => b[1] - a[1]);
        const top = ranked[0];
        const second = ranked[1];
        if (top) {
          topCompHits[top[0]] = (topCompHits[top[0]] || 0) + 1;
          const share = total ? top[1] / total : 0;
          const gap = second ? top[1] - second[1] : top[1];
          if (share >= 0.35 || gap >= 500) {
            domLogs.push({ label: S[k]?.label || k, comp: top[0], share, gap, count: top[1] });
          }
        }
      });
      const aggTotal = Object.values(aggComps).reduce((s, v) => s + v, 0);
      const aggTop = Object.entries(aggComps).sort((a, b) => b[1] - a[1])[0];
      if (aggTop && aggTotal) {
        ins.push(`Top component by event load: <b>${aggTop[0]}</b> (${aggTop[1].toLocaleString()} events, ${fmt(aggTop[1] / aggTotal * 100, 1)}% share across diagnostics logs).`);
      }
      if (domLogs.length) {
        ins.push(`Component concentration seen in: ${domLogs.map(x => `<b>${x.label}</b> → ${x.comp} (${fmt(x.share * 100, 1)}%, ${x.count.toLocaleString()} events)`).join(', ')}.`);
      }
      const recurringTop = Object.entries(topCompHits).sort((a, b) => b[1] - a[1])[0];
      if (recurringTop && recurringTop[1] >= Math.max(2, Math.ceil(dkeys.length / 2))) {
        ins.push(`Recurring dominant component: <b>${recurringTop[0]}</b> led ${recurringTop[1]} of ${dkeys.length} diagnostics logs.`);
      }
      // NO ENTRY reasons summary
      const allNoEntry = {};
      dkeys.forEach(k => { Object.entries(DG[k].no_entry_reasons || {}).forEach(([r, v]) => { allNoEntry[r] = (allNoEntry[r] || 0) + v }) });
      if (Object.keys(allNoEntry).length) {
        const totalNE = Object.values(allNoEntry).reduce((s, v) => s + v, 0);
        ins.push(`NO ENTRY events total: ${totalNE}. Breakdown: ${Object.entries(allNoEntry).sort((a, b) => b[1] - a[1]).map(([r, v]) => `${r}: ${v}`).join(', ')}.`);
      }
      return ins;
    }

  <div class="st ${cls}">⑤ Edge saat Entry</div>
  <div class="g4">
    ${metricCard('Avg Edge', `<span class="wrn">${fmt(a.avg_edge, 4)}</span>`, prevA ? 'prev: ' + fmt(prevA.avg_edge, 4) : '', 'hi-a')}
    ${metricCard('W/L Ratio', a.avg_loss ? (Math.abs(a.avg_win / a.avg_loss).toFixed(1) + 'x') : '∞', '')}
    ${metricCard('Side UP', `<span class="pos">${a.side_up}</span>`, '')}
    ${metricCard('Side DOWN', `<span class="neg">${a.side_down}</span>`, '')}
  </div>

  <div class="st ${cls}">⑥ Profit per Jam (UTC)</div>
  <div class="g2">
    <div class="cd"><div class="ct"><span class="dot" style="background:${col}"></span>Avg PnL per Hour</div><div class="cw"><canvas id="cHr"></canvas></div></div>
    <div class="cd"><div class="ct">Detail</div><div style="max-height:180px;overflow-y:auto">
    <table class="tbl"><thead><tr><th>Hour</th><th class="r">Avg PnL</th></tr></thead><tbody>
    ${Object.entries(hp).sort((a, b) => b[1] - a[1]).map(([h, p]) => `<tr><td>${String(h).padStart(2, '0')}:00</td><td class="r ${pc(p)}">${p >= 0 ? '+' : ''}${fmt(p)}</td></tr>`).join('')}
    </tbody></table></div>
    ${a.best_hour != null ? `<div style="margin-top:5px;font-size:9px">Best: <span class="tag tag-g">${String(a.best_hour).padStart(2, '0')}:00</span> Worst: <span class="tag tag-r" style="margin-left:3px">${String(a.worst_hour).padStart(2, '0')}:00</span></div>` : ''}</div>
  </div>

  <div class="st ${cls}">⑦ Momentum & Gap</div>
  <div class="g4">
    ${metricCard('Mom 5s', fmt(a.avg_m5), 'BTC $ 5s')}
    ${metricCard('Mom 15s', fmt(a.avg_m15), 'BTC $ 15s')}
    ${metricCard('Sigma 30s', fmt(a.avg_sigma), 'volatility')}
    ${metricCard('Z-Score', fmt(a.avg_zscore), 'deviation')}
  </div>

  <div class="st ${cls}">⑧ Pola Chart</div>
  <div class="g2">
    <div class="cd"><div class="ct"><span class="dot" style="background:${col}"></span>Pattern Distribution</div><div class="cw"><canvas id="cPt"></canvas></div></div>
    <div class="cd"><div class="ct">Side & PnL Buckets</div>
      <div style="margin-bottom:6px"><div style="font-size:9px;color:var(--t3);margin-bottom:2px">Side</div>
      <div class="bar-h" style="height:20px">
        <div style="width:${a.side_up / Math.max(a.side_up + a.side_down, 1) * 100}%;background:var(--grn)">UP ${a.side_up}</div>
        <div style="width:${a.side_down / Math.max(a.side_up + a.side_down, 1) * 100}%;background:var(--red)">DN ${a.side_down}</div>
      </div></div>
      <div><div style="font-size:9px;color:var(--t3);margin-bottom:2px">PnL Buckets</div>
      <div class="bar-h" style="height:20px">
        ${['big_loss', 'small_loss', 'breakeven', 'small_win', 'big_win'].map(b => {
        if (!bk[b]) return '';
        const colors = { big_loss: '#dc2626', small_loss: '#f87171', breakeven: '#94a3b8', small_win: '#4ade80', big_win: '#16a34a' };
        return `<div style="width:${bk[b] / Math.max(bkTot, 1) * 100}%;background:${colors[b]}">${bk[b]}</div>`;
      }).join('')}
      </div></div>
    </div>
  </div>

  <div class="st ${cls}">⑨ Scatter Analysis</div>
  <div class="g2">
    <div class="cd"><div class="ct"><span class="dot" style="background:${col}"></span>Entry Offset vs PnL</div><div class="cw"><canvas id="cS1"></canvas></div></div>
    <div class="cd"><div class="ct"><span class="dot" style="background:${col}"></span>Hold Time vs PnL</div><div class="cw"><canvas id="cS2"></canvas></div></div>
  </div>`;

      el.innerHTML = html;

      // Charts
      const hours = Array.from({ length: 24 }, (_, i) => i);
      mc('cHr', { type: 'bar', data: { labels: hours.map(h => String(h).padStart(2, '0')), datasets: [{ data: hours.map(h => hp[String(h)] || null), backgroundColor: hours.map(h => (hp[String(h)] || 0) >= 0 ? col + 'aa' : 'rgba(239,68,68,.5)'), borderRadius: 2 }] }, options: copts('$', false) });

      mc('cPt', { type: 'doughnut', data: { labels: ['Uptrend', 'Downtrend', 'Sideways'], datasets: [{ data: [pat.uptrend || 0, pat.downtrend || 0, pat.sideways || 0], backgroundColor: ['rgba(34,197,94,.7)', 'rgba(239,68,68,.7)', 'rgba(100,116,139,.5)'], borderWidth: 0 }] }, options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom', labels: { color: '#94a3b8', font: { size: 9 }, padding: 6 } } } } });

      const catKey = { fe: 'Forced Exit', er: 'Edge Runtuh', ts: 'Trailing Stop', hs: 'Hard Stop', be: 'Binance Early' }[cat] || cat;
      const sc = SC[key]?.[catKey] || [];
      mc('cS1', { type: 'scatter', data: { datasets: [{ data: sc.map(p => ({ x: p.off, y: p.pnl })), backgroundColor: sc.map(p => p.pnl >= 0 ? 'rgba(34,197,94,.5)' : 'rgba(239,68,68,.5)'), pointRadius: 2.5 }] }, options: { ...copts('', false), scales: { x: { title: { display: true, text: 'Entry Offset (s)', color: '#64748b', font: { size: 8 } }, grid: { color: 'rgba(30,41,59,.3)' }, ticks: { color: '#64748b', font: { size: 8 } } }, y: { title: { display: true, text: 'PnL ($)', color: '#64748b', font: { size: 8 } }, grid: { color: 'rgba(30,41,59,.3)' }, ticks: { color: '#64748b', font: { size: 8 } } } }, plugins: { legend: { display: false } } } });

      mc('cS2', { type: 'scatter', data: { datasets: [{ data: sc.map(p => ({ x: p.hold, y: p.pnl })), backgroundColor: sc.map(p => p.pnl >= 0 ? 'rgba(59,130,246,.5)' : 'rgba(239,68,68,.5)'), pointRadius: 2.5 }] }, options: { ...copts('', false), scales: { x: { title: { display: true, text: 'Hold (s)', color: '#64748b', font: { size: 8 } }, grid: { color: 'rgba(30,41,59,.3)' }, ticks: { color: '#64748b', font: { size: 8 } } }, y: { title: { display: true, text: 'PnL ($)', color: '#64748b', font: { size: 8 } }, grid: { color: 'rgba(30,41,59,.3)' }, ticks: { color: '#64748b', font: { size: 8 } } } }, plugins: { legend: { display: false } } } });
    }

    // ==================== DIAGNOSTICS ====================
    function renderDiag(el) {
      const dkeys = Object.keys(DG);
      if (!dkeys.length) return el.innerHTML = '<div class="no-data">No JSONL diagnostics available</div>';
      const tl = k => S[k]?.label?.replace('Trade-Log-', 'TL-') || k;

      let html = `
  <div class="alert" style="border-color:rgba(20,184,166,.3);background:rgba(20,184,166,.08)"><span style="font-size:15px">🔧</span><div>
  <b>Event Diagnostics</b> — aggregated from events_*.jsonl files. Fokus pada operational health, bukan trade outcome.
  </div></div>

  <div class="st dg">Operational KPI Cards</div>
  <div class="g${Math.min(dkeys.length, 6)}">
  ${dkeys.map(k => {
        const d = DG[k]; const trades = S[k]?.total || 1; const warnPct = (d.warnings / d.total_events * 100); const ept = (d.total_events / trades); const wpt = (d.warnings / trades); const dc100 = (d.disconnects / trades * 100); const rc100 = (d.reconnects / trades * 100); return `<div class="m">
    <div class="lb">${S[k]?.label || k}</div>
    <div style="font-size:10px;margin-top:3px">Events: <b>${d.total_events.toLocaleString()}</b></div>
    <div style="font-size:10px">Events/Trade: <b>${fmt(ept, 1)}</b></div>
    <div style="font-size:10px">Warnings: <span class="wrn">${d.warnings}</span> (<b>${fmt(warnPct, 1)}%</b>)</div>
    <div style="font-size:10px">Warns/Trade: <b>${fmt(wpt, 2)}</b></div>
    <div style="font-size:10px">DC/100 Trades: <b class="neg">${fmt(dc100, 0)}</b></div>
    <div style="font-size:10px">RC/100 Trades: <b class="pos">${fmt(rc100, 0)}</b></div>
    <div style="font-size:10px">RC Success: <b>${d.disconnects ? (d.reconnects / d.disconnects * 100).toFixed(0) + '%' : '—'}</b></div>
  </div>`}).join('')}</div>

  <div class="st dg">Severity Distribution</div>
  <div class="g2">
    <div class="cd"><div class="ct"><span class="dot" style="background:var(--teal)"></span>Severity Breakdown</div><div class="cw"><canvas id="cSev"></canvas></div></div>
    <div class="cd"><div class="ct">Severity Table</div>
    <table class="tbl"><thead><tr><th>Severity</th>${dkeys.map(k => `<th class="r">${tl(k)}</th>`).join('')}</tr></thead><tbody>
    ${(() => { const allSev = new Set(); dkeys.forEach(k => Object.keys(DG[k].severities).forEach(s => allSev.add(s))); return [...allSev].sort().map(s => '<tr><td>' + s + '</td>' + dkeys.map(k => '<td class="r">' + (DG[k].severities[s] || 0) + '</td>').join('') + '</tr>').join('') })()}
    </tbody></table></div>
  </div>

  <div class="st dg">Event Type Distribution</div>
  <div class="cd" style="overflow-x:auto"><table class="tbl"><thead><tr><th>Event Type</th>${dkeys.map(k => `<th class="r">${tl(k)}</th>`).join('')}</tr></thead><tbody>
  ${(() => { const allTypes = new Set(); dkeys.forEach(k => Object.keys(DG[k].event_types).forEach(t => allTypes.add(t))); return [...allTypes].sort().map(t => '<tr><td>' + t + '</td>' + dkeys.map(k => '<td class="r">' + (DG[k].event_types[t] || 0) + '</td>').join('') + '</tr>').join('') })()}
  </tbody></table></div>

  <div class="st dg">Component Distribution</div>
  <div class="cd" style="overflow-x:auto"><table class="tbl"><thead><tr><th>Component</th>${dkeys.map(k => `<th class="r">${tl(k)}</th>`).join('')}</tr></thead><tbody>
  ${(() => { const allComps = new Set(); dkeys.forEach(k => Object.keys(DG[k].components).forEach(c => allComps.add(c))); return [...allComps].sort().map(c => '<tr><td>' + c + '</td>' + dkeys.map(k => '<td class="r">' + (DG[k].components[c] || 0) + '</td>').join('') + '</tr>').join('') })()}
  </tbody></table></div>

  <div class="st dg">NO ENTRY Reasons</div>
  <div class="cd" style="overflow-x:auto"><table class="tbl"><thead><tr><th>Reason</th>${dkeys.map(k => `<th class="r">${tl(k)}</th>`).join('')}</tr></thead><tbody>
  ${(() => { const allR = new Set(); dkeys.forEach(k => Object.keys(DG[k].no_entry_reasons || {}).forEach(r => allR.add(r))); const rows = [...allR].sort().map(r => '<tr><td>' + r + '</td>' + dkeys.map(k => '<td class="r">' + (DG[k].no_entry_reasons?.[r] || 0) + '</td>').join('') + '</tr>').join(''); return rows || '<tr><td colspan="99" style="color:var(--t3);text-align:center">No NO ENTRY data available</td></tr>' })()}
  </tbody></table></div>

  <div class="st dg">Daily Event Density</div>
  <div class="g2">
  ${dkeys.filter(k => Object.keys(DG[k].daily_events).length > 1).map(k => {
          const id = 'cDg_' + k.replace(/[^a-z0-9]/g, '');
          return `<div class="cd"><div class="ct"><span class="dot" style="background:var(--teal)"></span>${S[k]?.label || k} — Daily</div><div class="cw"><canvas id="${id}"></canvas></div></div>`;
        }).join('')}</div>

  <div class="st dg">Detailed KPI Table</div>
  <div class="cd"><table class="tbl"><thead><tr><th>KPI</th>${dkeys.map(k => `<th class="r">${tl(k)}</th>`).join('')}</tr></thead><tbody>
  <tr><td>Total Events</td>${dkeys.map(k => `<td class="r">${DG[k].total_events.toLocaleString()}</td>`).join('')}</tr>
  <tr><td>Events / Trade</td>${dkeys.map(k => `<td class="r">${S[k] ? fmt(DG[k].total_events / S[k].total, 1) : '—'}</td>`).join('')}</tr>
  <tr><td>Warnings</td>${dkeys.map(k => `<td class="r wrn">${DG[k].warnings}</td>`).join('')}</tr>
  <tr><td>Warning Share %</td>${dkeys.map(k => `<td class="r">${fmt(DG[k].warnings / DG[k].total_events * 100, 1)}%</td>`).join('')}</tr>
  <tr><td>Warns / Trade</td>${dkeys.map(k => `<td class="r">${S[k] ? fmt(DG[k].warnings / S[k].total, 2) : '—'}</td>`).join('')}</tr>
  <tr><td>Disconnects</td>${dkeys.map(k => `<td class="r neg">${DG[k].disconnects}</td>`).join('')}</tr>
  <tr><td>DC / 100 Trades</td>${dkeys.map(k => `<td class="r">${S[k] ? fmt(DG[k].disconnects / S[k].total * 100, 0) : '—'}</td>`).join('')}</tr>
  <tr><td>Reconnects</td>${dkeys.map(k => `<td class="r pos">${DG[k].reconnects}</td>`).join('')}</tr>
  <tr><td>RC / 100 Trades</td>${dkeys.map(k => `<td class="r">${S[k] ? fmt(DG[k].reconnects / S[k].total * 100, 0) : '—'}</td>`).join('')}</tr>
  <tr><td>RC Success %</td>${dkeys.map(k => `<td class="r">${DG[k].disconnects ? fmt(DG[k].reconnects / DG[k].disconnects * 100, 0) + '%' : '—'}</td>`).join('')}</tr>
  </tbody></table></div>

  <div class="st dg">Operational Observations</div>
  <div class="vb" style="border-color:var(--teal)"><b>🔧 Auto-generated:</b><br>
  ${genDiagInsights(dkeys).map(i => '• ' + i).join('<br>')}</div>`;

      el.innerHTML = html;

      // Severity chart
      const sevLabels = ['INFO', 'WARNING', 'CRITICAL'];
      mc('cSev', { type: 'bar', data: { labels: dkeys.map(k => tl(k)), datasets: sevLabels.map((s, i) => ({ label: s, data: dkeys.map(k => DG[k].severities?.[s] || 0), backgroundColor: ['rgba(20,184,166,.5)', 'rgba(245,158,11,.6)', 'rgba(239,68,68,.7)'][i], borderRadius: 2 })) }, options: { ...copts('', true), scales: { x: { stacked: true, grid: { display: false }, ticks: { color: '#64748b', font: { size: 8 } } }, y: { stacked: true, grid: { color: 'rgba(30,41,59,.35)' }, ticks: { color: '#64748b', font: { size: 8 } } } } } });

      // Daily event density charts
      dkeys.filter(k => Object.keys(DG[k].daily_events).length > 1).forEach(k => {
        const id = 'cDg_' + k.replace(/[^a-z0-9]/g, '');
        const days = Object.keys(DG[k].daily_events).sort();
        mc(id, {
          type: 'bar', data: {
            labels: days, datasets: [
              { label: 'Events', data: days.map(d => DG[k].daily_events[d] || 0), backgroundColor: 'rgba(20,184,166,.4)', borderRadius: 2 },
              { label: 'Warnings', data: days.map(d => DG[k].daily_warns?.[d] || 0), backgroundColor: 'rgba(245,158,11,.5)', borderRadius: 2 },
              { label: 'Trades', data: days.map(d => (DG[k].daily_trades?.[d] || 0) / 2), backgroundColor: 'rgba(59,130,246,.5)', borderRadius: 2 }
            ]
          }, options: copts('', true)
        });
      });
    }

    init();
  </script>
</body>

</html>
