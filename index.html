&lt;style&gt;
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --c-bg: #f6f5f1;
  --c-surface: #ffffff;
  --c-surface-alt: #f0eee8;
  --c-border: #e0ddd5;
  --c-border-strong: #c8c4b8;
  --c-text: #1a1a18;
  --c-text-secondary: #5a584f;
  --c-text-muted: #8a877d;
  --c-accent: #1b6b4a;
  --c-accent-light: #e8f5ee;
  --c-blue: #2563a0;
  --c-blue-light: #e8f0f8;
  --c-amber: #a07825;
  --c-amber-light: #fdf6e3;
  --c-red-light: #fef2f2;
  --c-green-badge: #16a34a;
  --c-blue-badge: #2563eb;
  --c-amber-badge: #d97706;
  --c-gray-badge: #71717a;
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.04), 0 1px 2px rgba(0,0,0,0.03);
  --shadow-md: 0 4px 12px rgba(0,0,0,0.06), 0 1px 3px rgba(0,0,0,0.04);
  --radius: 8px;
  --radius-lg: 12px;
  --font-body: &#x27;DM Sans&#x27;, -apple-system, sans-serif;
  --font-display: &#x27;Source Serif 4&#x27;, Georgia, serif;
}

html { scroll-behavior: smooth; }

body {
  font-family: var(--font-body);
  background: var(--c-bg);
  color: var(--c-text);
  line-height: 1.65;
  font-size: 15px;
  -webkit-font-smoothing: antialiased;
}

.container {
  max-width: 960px;
  margin: 0 auto;
  padding: 0 24px;
}

/* ── Header ── */
.page-header {
  background: linear-gradient(135deg, #1a2a1f 0%, #0f1f15 100%);
  color: #fff;
  padding: 56px 0 48px;
  position: relative;
  overflow: hidden;
}
.page-header::before {
  content: &#x27;&#x27;;
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  background: radial-gradient(ellipse at 80% 20%, rgba(27,107,74,0.15) 0%, transparent 60%);
}
.page-header .container { position: relative; }
.page-header h1 {
  font-family: var(--font-display);
  font-size: 2rem;
  font-weight: 700;
  letter-spacing: -0.01em;
  margin-bottom: 8px;
}
.page-header .subtitle {
  font-size: 14.5px;
  color: rgba(255,255,255,0.72);
  max-width: 600px;
  line-height: 1.6;
  margin-bottom: 28px;
}
.header-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 20px 36px;
  font-size: 13px;
  color: rgba(255,255,255,0.55);
}
.header-meta span { display: flex; align-items: center; gap: 6px; }
.header-meta strong { color: rgba(255,255,255,0.88); font-weight: 500; }

/* ── Sections ── */
section { padding: 48px 0; }
section + section { border-top: 1px solid var(--c-border); }
.section-label {
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--c-accent);
  margin-bottom: 6px;
}
.section-title {
  font-family: var(--font-display);
  font-size: 1.45rem;
  font-weight: 700;
  margin-bottom: 10px;
  color: var(--c-text);
}
.section-desc {
  color: var(--c-text-secondary);
  font-size: 14.5px;
  max-width: 640px;
  margin-bottom: 28px;
}

/* ── Snapshot Cards ── */
.snapshot-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(165px, 1fr));
  gap: 14px;
}
.snap-card {
  background: var(--c-surface);
  border: 1px solid var(--c-border);
  border-radius: var(--radius);
  padding: 20px 18px;
  text-align: center;
  box-shadow: var(--shadow-sm);
  opacity: 0;
  transform: translateY(12px);
  animation: fadeUp 0.5s ease forwards;
}
.snap-card:nth-child(1) { animation-delay: 0.05s; }
.snap-card:nth-child(2) { animation-delay: 0.1s; }
.snap-card:nth-child(3) { animation-delay: 0.15s; }
.snap-card:nth-child(4) { animation-delay: 0.2s; }
.snap-card:nth-child(5) { animation-delay: 0.25s; }
.snap-icon {
  width: 36px; height: 36px;
  margin: 0 auto 10px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px;
}
.snap-icon.green  { background: var(--c-accent-light); color: var(--c-accent); }
.snap-icon.blue   { background: var(--c-blue-light);   color: var(--c-blue); }
.snap-card h3 {
  font-size: 13.5px;
  font-weight: 600;
  margin-bottom: 4px;
}
.snap-card p {
  font-size: 12px;
  color: var(--c-text-muted);
  line-height: 1.5;
}

/* ── Result Cards ── */
.result-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 16px;
}
.result-card {
  background: var(--c-surface);
  border: 1px solid var(--c-border);
  border-radius: var(--radius);
  padding: 22px 20px;
  box-shadow: var(--shadow-sm);
}
.result-card h4 {
  font-size: 14px;
  font-weight: 600;
  margin-bottom: 6px;
  display: flex; align-items: center; gap: 8px;
}
.result-card p {
  font-size: 13px;
  color: var(--c-text-secondary);
  line-height: 1.55;
}

/* ── Data Table ── */
.data-table-wrap {
  overflow-x: auto;
  border: 1px solid var(--c-border);
  border-radius: var(--radius);
  box-shadow: var(--shadow-sm);
  background: var(--c-surface);
}
table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13.5px;
}
thead { background: var(--c-surface-alt); }
th {
  text-align: left;
  padding: 12px 16px;
  font-weight: 600;
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--c-text-secondary);
  border-bottom: 1px solid var(--c-border);
}
td {
  padding: 12px 16px;
  border-bottom: 1px solid var(--c-border);
  vertical-align: top;
}
tr:last-child td { border-bottom: none; }
tbody tr:hover { background: rgba(27,107,74,0.02); }

/* ── Badges ── */
.badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 3px 10px;
  border-radius: 100px;
  font-size: 11.5px;
  font-weight: 600;
  white-space: nowrap;
}
.badge::before {
  content: &#x27;&#x27;;
  width: 6px; height: 6px;
  border-radius: 50%;
  flex-shrink: 0;
}
.badge-completed { background: #e8f5ee; color: #15803d; }
.badge-completed::before { background: #16a34a; }
.badge-final { background: #e0f2fe; color: #0369a1; }
.badge-final::before { background: #0284c7; }
.badge-stable { background: #f0fdf4; color: #166534; }
.badge-stable::before { background: #22c55e; }
.badge-ready { background: #fef9c3; color: #854d0e; }
.badge-ready::before { background: #eab308; }
.badge-notstarted { background: #f4f4f5; color: #71717a; }
.badge-notstarted::before { background: #a1a1aa; }
.badge-active { background: #dbeafe; color: #1d4ed8; }
.badge-active::before { background: #3b82f6; animation: pulse 2s infinite; }

@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}

/* ── You-Are-Here row ── */
.row-youarehere {
  background: var(--c-amber-light) !important;
}
.row-youarehere td:first-child {
  position: relative;
  padding-left: 28px;
}
.row-youarehere td:first-child::before {
  content: &#x27;▸&#x27;;
  position: absolute;
  left: 10px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--c-amber-badge);
  font-weight: 700;
  font-size: 14px;
}

/* ── Focus / Next ── */
.focus-list, .next-list {
  list-style: none;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.focus-list li, .next-list li {
  padding: 14px 18px;
  background: var(--c-surface);
  border: 1px solid var(--c-border);
  border-radius: var(--radius);
  font-size: 14px;
  color: var(--c-text-secondary);
  display: flex;
  align-items: flex-start;
  gap: 10px;
  box-shadow: var(--shadow-sm);
}
.focus-list li::before {
  content: &#x27;&#x27;;
  width: 8px; height: 8px;
  background: var(--c-accent);
  border-radius: 50%;
  margin-top: 6px;
  flex-shrink: 0;
}
.next-list li::before {
  content: &#x27;&#x27;;
  width: 8px; height: 8px;
  background: var(--c-blue);
  border-radius: 2px;
  margin-top: 6px;
  flex-shrink: 0;
}

/* ── Prose ── */
.prose { max-width: 680px; }
.prose p { margin-bottom: 12px; color: var(--c-text-secondary); font-size: 14.5px; }
.prose p:last-child { margin-bottom: 0; }

/* ── Footer ── */
.page-footer {
  padding: 28px 0;
  text-align: center;
  font-size: 12px;
  color: var(--c-text-muted);
  border-top: 1px solid var(--c-border);
}

/* ── Animations ── */
@keyframes fadeUp {
  to { opacity: 1; transform: translateY(0); }
}

/* ── Mobile ── */
@media (max-width: 640px) {
  .page-header { padding: 36px 0 32px; }
  .page-header h1 { font-size: 1.5rem; }
  .header-meta { gap: 10px 20px; }
  section { padding: 32px 0; }
  .section-title { font-size: 1.2rem; }
  .snapshot-grid { grid-template-columns: repeat(2, 1fr); }
  .result-grid { grid-template-columns: 1fr; }
  th, td { padding: 10px 12px; font-size: 12.5px; }
}
