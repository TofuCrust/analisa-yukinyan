<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yukinyan — Force Exit & Edge Runtuh Analysis</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&family=DM+Sans:wght@300;400;500;600;700&display=swap');
:root{
--bg0:#06090f;--bg1:#0d1117;--bg2:#151b27;--bg3:#1c2436;
--brd:#1e293b;--brd2:#2a3a54;
--t1:#e2e8f0;--t2:#94a3b8;--t3:#64748b;
--grn:#22c55e;--grn-d:rgba(34,197,94,.12);--grn-b:rgba(34,197,94,.3);
--red:#ef4444;--red-d:rgba(239,68,68,.12);--red-b:rgba(239,68,68,.3);
--amb:#f59e0b;--amb-d:rgba(245,158,11,.1);--amb-b:rgba(245,158,11,.3);
--blu:#3b82f6;--blu-d:rgba(59,130,246,.12);--blu-b:rgba(59,130,246,.3);
--cyn:#06b6d4;--pur:#a855f7;--pnk:#ec4899;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',system-ui,sans-serif;background:var(--bg0);color:var(--t1);font-size:13px}
.mono{font-family:'JetBrains Mono',monospace}

/* HEADER */
.hdr{background:var(--bg1);border-bottom:1px solid var(--brd);padding:14px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;backdrop-filter:blur(12px)}
.hdr-l{display:flex;align-items:center;gap:12px}
.logo{width:34px;height:34px;background:linear-gradient(135deg,var(--amb),#d97706);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;color:#000}
.hdr h1{font-size:15px;font-weight:600;letter-spacing:-.02em}
.hdr .sub{font-size:10px;color:var(--t3);margin-top:1px}
.tabs{display:flex;gap:3px;background:var(--bg2);border-radius:8px;padding:3px;border:1px solid var(--brd)}
.tab{padding:6px 13px;font-size:11px;font-weight:500;border:none;background:transparent;color:var(--t3);cursor:pointer;border-radius:6px;transition:.12s;white-space:nowrap}
.tab:hover{color:var(--t2);background:var(--bg3)}
.tab.on{background:var(--amb);color:#000;font-weight:600}
.tab.cmp.on{background:var(--cyn);color:#000}
.tab.hum.on{background:var(--pnk);color:#000}

/* LAYOUT */
.main{padding:14px 20px 40px;max-width:1400px;margin:0 auto}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}

/* CARDS & METRICS */
.m{background:var(--bg2);border:1px solid var(--brd);border-radius:8px;padding:10px 12px;transition:border-color .12s}
.m:hover{border-color:var(--brd2)}
.m.hi-a{border-color:var(--amb-b);background:var(--amb-d)}
.m.hi-g{border-color:var(--grn-b);background:var(--grn-d)}
.m.hi-r{border-color:var(--red-b);background:var(--red-d)}
.m.hi-b{border-color:var(--blu-b);background:var(--blu-d)}
.m .lb{font-size:9px;color:var(--t3);text-transform:uppercase;letter-spacing:.06em;font-weight:500;margin-bottom:3px}
.m .vl{font-size:18px;font-weight:600;line-height:1.2}
.m .sb{font-size:9.5px;color:var(--t3);margin-top:2px}
.pos{color:var(--grn)}.neg{color:var(--red)}.wrn{color:var(--amb)}.bl{color:var(--blu)}

.cd{background:var(--bg2);border:1px solid var(--brd);border-radius:8px;padding:12px 14px;margin-bottom:10px}
.ct{font-size:10px;font-weight:600;color:var(--t3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px;display:flex;align-items:center;gap:5px}
.ct .dot{width:6px;height:6px;border-radius:50%}
.cw{position:relative;height:190px}
.cw.tall{height:240px}

.st{font-size:13px;font-weight:600;margin:18px 0 10px;padding-left:9px;border-left:3px solid var(--amb)}
.st.er-s{border-color:var(--red)}
.st.ts-s{border-color:var(--blu)}
.st.hs-s{border-color:var(--pur)}

.vb{background:var(--bg1);border-left:3px solid var(--amb);border-radius:0 6px 6px 0;padding:9px 12px;font-size:11px;line-height:1.7;color:var(--t2);margin-bottom:10px}
.vb.er-vb{border-color:var(--red)}

.alert{background:var(--amb-d);border:1px solid var(--amb-b);border-radius:8px;padding:10px 14px;margin-bottom:12px;display:flex;align-items:flex-start;gap:8px;font-size:11.5px;line-height:1.6}

table.tbl{width:100%;font-size:11px;border-collapse:collapse}
.tbl th{padding:5px 7px;text-align:left;color:var(--t3);font-weight:400;font-size:9px;text-transform:uppercase;letter-spacing:.04em;border-bottom:1px solid var(--brd)}
.tbl td{padding:4px 7px;border-bottom:1px solid rgba(30,41,59,.4)}
.tbl tr:last-child td{border-bottom:none}
.tbl .r{text-align:right}

.bar-h{display:flex;height:18px;border-radius:4px;overflow:hidden;margin:4px 0}
.bar-h>div{display:flex;align-items:center;justify-content:center;font-size:8.5px;font-weight:600;color:#000;min-width:16px}

.tag{display:inline-block;padding:2px 7px;border-radius:4px;font-size:9.5px;font-weight:500}
.tag-g{background:var(--grn-d);color:var(--grn);border:1px solid var(--grn-b)}
.tag-r{background:var(--red-d);color:var(--red);border:1px solid var(--red-b)}
.tag-a{background:var(--amb-d);color:var(--amb);border:1px solid var(--amb-b)}
.tag-b{background:var(--blu-d);color:var(--blu);border:1px solid var(--blu-b)}

.no-data{text-align:center;padding:40px;color:var(--t3);font-size:13px}

/* EXIT TYPE TOGGLE */
.et-tabs{display:flex;gap:3px;margin-bottom:12px;background:var(--bg1);border-radius:6px;padding:3px;border:1px solid var(--brd);width:fit-content}
.et{padding:5px 12px;font-size:10px;font-weight:500;border:none;background:transparent;color:var(--t3);cursor:pointer;border-radius:4px;transition:.12s}
.et:hover{color:var(--t2)}
.et.on-fe{background:var(--amb);color:#000;font-weight:600}
.et.on-er{background:var(--red);color:#fff;font-weight:600}
.et.on-ts{background:var(--blu);color:#fff;font-weight:600}
.et.on-hs{background:var(--pur);color:#fff;font-weight:600}

@media(max-width:900px){.g4{grid-template-columns:repeat(2,1fr)}.g2{grid-template-columns:1fr}.hdr{flex-direction:column;gap:10px;align-items:flex-start}.tabs{flex-wrap:wrap}}
</style>
</head>

  const d=S[key];
  if(!d)return el.innerHTML='<div class="no-data">No data</div>';

  // Determine available exit types
  const available=[];
  if(d.fe)available.push('fe');
  if(d.er)available.push('er');
  if(d.ts)available.push('ts');
  if(d.hs)available.push('hs');
  if(!curET[key]||!available.includes(curET[key]))curET[key]=available[0]||'ts';

  let html=`
  <div class="alert"><span style="font-size:16px">📊</span><div>
  <b>${tab}</b> — ${d.total} trades, Net PnL: ${fpnl(d.total_pnl)}, Win Rate: ${fpct(d.win_rate)}, Avg Hold: ${fsec(d.avg_hold)}
  </div></div>

  <div class="st">Exit Reason Breakdown</div>
  <div class="g4">${Object.entries(d.bd).sort((a,b)=>b[1].count-a[1].count).map(([c,v])=>{
    const isProfit=v.total_pnl>=0;
    return`<div class="m ${isProfit?'hi-g':'hi-r'}">
      <div class="lb" style="color:${ECOL[c]||'var(--t3)'}">${ENAME[c]||c}</div>
      <div class="vl mono" style="font-size:15px">${v.count} <span style="font-size:10px;color:var(--t3)">(${fpct(v.pct)})</span></div>
      <div class="sb">${fpnl(v.total_pnl)}</div>
    </div>`;
  }).join('')}</div>

  <div class="cd"><div class="ct"><span class="dot" style="background:var(--t2)"></span>Equity Curve per Exit Type</div><div class="cw tall"><canvas id="cEq"></canvas></div></div>

  <div class="st">Detail Analisis per Exit Type</div>
  <div class="et-tabs" id="etTabs">${available.map(c=>`<button class="et ${curET[key]===c?'on-'+c:''}" onclick="setET('${key}','${c}')">${ENAME[c]}</button>`).join('')}</div>
  <div id="etContent"></div>`;

  el.innerHTML=html;

  // Equity chart
  const ecKeys=Object.keys(d.bd);
  mc('cEq',{type:'line',data:{
    datasets:[{label:'Total',data:EQ[key].all.map((v,i)=>({x:i,y:v})),borderColor:'#94a3b8',borderWidth:1,pointRadius:0,tension:.3}].concat(ecKeys.map(c=>({label:ENAME[c]||c,data:EQ[key][c]?EQ[key][c].map((v,i)=>({x:i,y:v})):[],borderColor:ECOL[c]||'#64748b',borderWidth:1.5,pointRadius:0,tension:.3})))
  },options:{...copts('$',true),scales:{x:{type:'linear',display:true,grid:{display:false},ticks:{color:'#64748b',font:{size:9}}},y:{grid:{color:'rgba(30,41,59,.4)'},ticks:{color:'#64748b',font:{size:9},callback:v=>'$'+v}}}}});

  renderET(key);
}

function setET(key,cat){curET[key]=cat;document.querySelectorAll('.et').forEach(b=>{b.className='et';if(b.textContent===ENAME[cat])b.className='et on-'+cat});renderET(key);}

function renderET(key){
  // Destroy only ET-specific charts
  ['cHour','cPat','cSc1','cSc2'].forEach(id=>{if(charts[id]){try{charts[id].destroy()}catch(e){}delete charts[id]}});

  const cat=curET[key];
  const a=S[key][cat];
  const el=document.getElementById('etContent');
  if(!a)return el.innerHTML='<div class="no-data">Tidak ada data untuk exit type ini</div>';

  const col=ECOL[cat];
  const name=ENAME[cat];
  const cls=cat==='fe'?'':cat==='er'?'er-s':cat==='ts'?'ts-s':'hs-s';
  const hp=a.hour_pnl||{};
  const pat=a.patterns||{};
  const patTot=(pat.uptrend||0)+(pat.downtrend||0)+(pat.sideways||0);
  const bk=a.pnl_buckets||{};
  const bkTot=Object.values(bk).reduce((a,b)=>a+b,0);
  const er=a.entry_reasons||{};

  let html=`
  <div class="st ${cls}">① ${name}: Rasio vs Total</div>
  <div class="g4">
    <div class="m hi-a"><div class="lb">${name} Count</div><div class="vl wrn mono">${a.count}</div><div class="sb">${fpct(S[key].bd[cat]?.pct)} dari ${S[key].total}</div></div>
    <div class="m ${a.total_pnl>=0?'hi-g':'hi-r'}"><div class="lb">Total PnL</div><div class="vl ${pc(a.total_pnl)} mono">${fpnl(a.total_pnl)}</div></div>
    <div class="m"><div class="lb">Win Rate</div><div class="vl mono ${a.win_rate>=50?'pos':'neg'}">${fpct(a.win_rate)}</div></div>
    <div class="m"><div class="lb">Avg PnL / Trade</div><div class="vl mono ${pc(a.avg_pnl)}">${fpnl(a.avg_pnl)}</div><div class="sb">median: ${fpnl(a.median_pnl)}</div></div>
  </div>

  <div class="st ${cls}">② Waktu Entry (offset dari awal sesi)</div>
  <div class="g4">
    <div class="m hi-a"><div class="lb">Avg Entry Offset</div><div class="vl wrn mono">${fsec(a.avg_entry_offset)}</div></div>
    <div class="m"><div class="lb">Median Entry Offset</div><div class="vl mono">${fsec(a.median_entry_offset)}</div></div>
    <div class="m"><div class="lb">Entry Reason</div><div class="vl" style="font-size:11px">${Object.entries(er).map(([k,v])=>`${k}: ${v}`).join('<br>')}</div></div>
    <div class="m"><div class="lb">Avg Entry Price</div><div class="vl mono">$${fmt(a.avg_entry_price,4)}</div></div>
  </div>

  <div class="st ${cls}">③ Lama Hold</div>
  <div class="g4">
    <div class="m hi-a"><div class="lb">Avg Hold</div><div class="vl wrn mono">${fsec(a.avg_hold)}</div></div>
    <div class="m"><div class="lb">Median Hold</div><div class="vl mono">${fsec(a.median_hold)}</div></div>
    <div class="m"><div class="lb">Min Hold</div><div class="vl mono">${fsec(a.min_hold)}</div></div>
    <div class="m"><div class="lb">Max Hold</div><div class="vl mono">${fsec(a.max_hold)}</div></div>
  </div>

  <div class="st ${cls}">④ Harga Entry & Exit</div>
  <div class="g4">
    <div class="m"><div class="lb">Avg Entry Price</div><div class="vl mono">$${fmt(a.avg_entry_price,4)}</div></div>
    <div class="m"><div class="lb">Avg Exit Price</div><div class="vl mono">$${fmt(a.avg_exit_price,4)}</div></div>
    <div class="m"><div class="lb">Spread</div><div class="vl mono ${pc(a.avg_exit_price-a.avg_entry_price)}">${fpnl(a.avg_exit_price-a.avg_entry_price)}</div></div>
    <div class="m"><div class="lb">Avg Win vs Loss</div><div class="vl" style="font-size:12px"><span class="pos">W: $${fmt(a.avg_win)}</span><br><span class="neg">L: $${fmt(a.avg_loss)}</span></div></div>
  </div>

  <div class="st ${cls}">⑤ Edge saat Entry</div>
  <div class="g4">
    <div class="m hi-a"><div class="lb">Avg Edge</div><div class="vl wrn mono">${fmt(a.avg_edge,4)}</div></div>
    <div class="m"><div class="lb">Win/Loss Ratio</div><div class="vl mono">${a.avg_loss?fmt(Math.abs(a.avg_win/a.avg_loss),1):'∞'}x</div></div>
    <div class="m"><div class="lb">Side UP</div><div class="vl pos mono">${a.side_up}</div></div>
    <div class="m"><div class="lb">Side DOWN</div><div class="vl neg mono">${a.side_down}</div></div>
  </div>

  <div class="st ${cls}">⑥ Profit per Jam (UTC)</div>
  <div class="g2">
    <div class="cd"><div class="ct"><span class="dot" style="background:${col}"></span>Avg PnL per Hour</div><div class="cw"><canvas id="cHour"></canvas></div></div>
    <div class="cd"><div class="ct">Detail</div><div style="max-height:190px;overflow-y:auto">
    <table class="tbl"><thead><tr><th>Hour</th><th class="r">Avg PnL</th></tr></thead><tbody>
    ${Object.entries(hp).sort((a,b)=>b[1]-a[1]).map(([h,p])=>`<tr><td>${String(h).padStart(2,'0')}:00</td><td class="r ${pc(p)}">${p>=0?'+':''}${fmt(p)}</td></tr>`).join('')}
    </tbody></table></div>
    ${a.best_hour!=null?`<div style="margin-top:6px;font-size:10px">Best: <span class="tag tag-g">${String(a.best_hour).padStart(2,'0')}:00 → $${fmt(a.best_hour_pnl)}</span> Worst: <span class="tag tag-r" style="margin-left:4px">${String(a.worst_hour).padStart(2,'0')}:00 → $${fmt(a.worst_hour_pnl)}</span></div>`:''}
    </div>
  </div>

  <div class="st ${cls}">⑦ Momentum & Gap Harga</div>
  <div class="g4">
    <div class="m"><div class="lb">Avg Momentum 5s</div><div class="vl mono">${fmt(a.avg_m5)}</div><div class="sb">BTC $ change 5s</div></div>
    <div class="m"><div class="lb">Avg Momentum 15s</div><div class="vl mono">${fmt(a.avg_m15)}</div><div class="sb">BTC $ change 15s</div></div>
    <div class="m"><div class="lb">Avg Sigma 30s</div><div class="vl mono">${fmt(a.avg_sigma)}</div><div class="sb">volatilitas</div></div>
    <div class="m"><div class="lb">Avg Z-Score</div><div class="vl mono">${fmt(a.avg_zscore)}</div><div class="sb">deviasi</div></div>
  </div>

  <div class="st ${cls}">⑧ Pola Chart & Distribusi</div>
  <div class="g2">
    <div class="cd"><div class="ct"><span class="dot" style="background:${col}"></span>Pola saat ${name}</div><div class="cw"><canvas id="cPat"></canvas></div></div>
    <div class="cd"><div class="ct">Side & PnL Buckets</div>
      <div style="margin-bottom:8px"><div style="font-size:10px;color:var(--t3);margin-bottom:3px">Side</div>
      <div class="bar-h" style="height:22px">
        <div style="width:${a.side_up/(a.side_up+a.side_down)*100}%;background:var(--grn)">UP ${a.side_up}</div>
        <div style="width:${a.side_down/(a.side_up+a.side_down)*100}%;background:var(--red)">DN ${a.side_down}</div>
      </div></div>
      <div><div style="font-size:10px;color:var(--t3);margin-bottom:3px">PnL Buckets</div>
      <div class="bar-h" style="height:22px">
        ${bk.big_loss?`<div style="width:${bk.big_loss/bkTot*100}%;background:#dc2626">${bk.big_loss}</div>`:''}
        ${bk.small_loss?`<div style="width:${bk.small_loss/bkTot*100}%;background:#f87171">${bk.small_loss}</div>`:''}
        ${bk.breakeven?`<div style="width:${bk.breakeven/bkTot*100}%;background:#94a3b8">${bk.breakeven}</div>`:''}
        ${bk.small_win?`<div style="width:${bk.small_win/bkTot*100}%;background:#4ade80">${bk.small_win}</div>`:''}
        ${bk.big_win?`<div style="width:${bk.big_win/bkTot*100}%;background:#16a34a">${bk.big_win}</div>`:''}
      </div>
      <div style="display:flex;gap:7px;font-size:9px;margin-top:3px;flex-wrap:wrap">
        <span style="color:#dc2626">◼ Loss>$1</span><span style="color:#f87171">◼ Loss<$1</span>
        <span style="color:#94a3b8">◼ ~$0</span><span style="color:#4ade80">◼ Win<$1</span><span style="color:#16a34a">◼ Win>$1</span>
      </div></div>
    </div>
  </div>

  <div class="st ${cls}">⑨ Scatter Analysis</div>
  <div class="g2">
    <div class="cd"><div class="ct"><span class="dot" style="background:${col}"></span>Entry Offset vs PnL</div><div class="cw"><canvas id="cSc1"></canvas></div></div>
    <div class="cd"><div class="ct"><span class="dot" style="background:${col}"></span>Hold Time vs PnL</div><div class="cw"><canvas id="cSc2"></canvas></div></div>
  </div>`;

  el.innerHTML=html;

  // Hour chart
  const hours=Array.from({length:24},(_,i)=>i);
  mc('cHour',{type:'bar',data:{labels:hours.map(h=>String(h).padStart(2,'0')),datasets:[{data:hours.map(h=>hp[h]||null),backgroundColor:hours.map(h=>(hp[h]||0)>=0?col+'aa':'rgba(239,68,68,.5)'),borderRadius:3}]},options:{...copts('$',false)}});

  // Pattern doughnut
  mc('cPat',{type:'doughnut',data:{labels:['Uptrend','Downtrend','Sideways'],datasets:[{data:[pat.uptrend||0,pat.downtrend||0,pat.sideways||0],backgroundColor:['rgba(34,197,94,.7)','rgba(239,68,68,.7)','rgba(100,116,139,.5)'],borderWidth:0}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{color:'#94a3b8',font:{size:10},padding:8}}}}});

  // Scatter plots
  const sc=SC[key]?.[cat]||[];
  mc('cSc1',{type:'scatter',data:{datasets:[{data:sc.map(p=>({x:p.off,y:p.pnl})),backgroundColor:sc.map(p=>p.pnl>=0?'rgba(34,197,94,.6)':'rgba(239,68,68,.6)'),pointRadius:3}]},options:{...copts('',false),scales:{x:{title:{display:true,text:'Entry Offset (s)',color:'#64748b',font:{size:9}},grid:{color:'rgba(30,41,59,.4)'},ticks:{color:'#64748b',font:{size:9}}},y:{title:{display:true,text:'PnL ($)',color:'#64748b',font:{size:9}},grid:{color:'rgba(30,41,59,.4)'},ticks:{color:'#64748b',font:{size:9}}}},plugins:{legend:{display:false}}}});

  mc('cSc2',{type:'scatter',data:{datasets:[{data:sc.map(p=>({x:p.hold,y:p.pnl})),backgroundColor:sc.map(p=>p.pnl>=0?'rgba(59,130,246,.6)':'rgba(239,68,68,.6)'),pointRadius:3}]},options:{...copts('',false),scales:{x:{title:{display:true,text:'Hold Time (s)',color:'#64748b',font:{size:9}},grid:{color:'rgba(30,41,59,.4)'},ticks:{color:'#64748b',font:{size:9}}},y:{title:{display:true,text:'PnL ($)',color:'#64748b',font:{size:9}},grid:{color:'rgba(30,41,59,.4)'},ticks:{color:'#64748b',font:{size:9}}}},plugins:{legend:{display:false}}}});
}

init();
</script>
</body>
</html>
